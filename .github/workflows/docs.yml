name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Verified GitHub Release tag to display (empty selects the latest available release)'
        required: false
        type: string

permissions:
  contents: read

# PR builds can replace an earlier check. Deployments serialize so a release
# refresh cannot race a default-branch publication.
concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    # Every job runs on the minis. Skipped on PRs.
    if: github.event_name != 'pull_request'
    uses: bloxwap/.github/.github/workflows/security-scan.yml@2a70724cd0d803abef5f5a7c64c46065f4fda19b # v1.1.0
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  build:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_BASE_PATH: /screensaver
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Resolve verified public downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            node scripts/fetch-release.mjs --tag "$RELEASE_TAG"
          else
            node scripts/fetch-release.mjs
          fi
      - run: npm run docs:check
      - run: npm run docs:build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: apps/docs/out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: website-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [build, security]
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check the selected branch build is current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          current_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)"
          if [ "$current_sha" != "$BUILD_SHA" ]; then
            echo 'The selected branch has a newer commit; skip this older build.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.current.outputs.deploy == 'true'
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: steps.current.outputs.deploy == 'true'
        id: deployment

  smoke:
    needs: deploy
    if: needs.deploy.outputs.page_url != ''
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      DOCS_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: deployed-website-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
